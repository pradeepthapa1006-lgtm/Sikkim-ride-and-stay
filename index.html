<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>Stay Cost Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
            max-width: 420px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #1e73ff;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Stay Cost Calculator</h2>

    <label>Number of Persons</label>
    <input type="number" id="persons" placeholder="Enter persons">

    <label>Check-in Date</label>
    <input type="date" id="startDate">

    <label>Check-out Date</label>
    <input type="date" id="endDate">

    <button onclick="calculateStay()">Calculate</button>

    <div class="result" id="stayTotal">
        Total: ₹0
    </div>

</div>


<script>
/* ===== EASY PRICE CHANGE HERE ===== */
const STAY_RATE = 1100;
/* ================================= */

function calculateStay() {

    let persons = Number(document.getElementById("persons").value);
    let start = document.getElementById("startDate").value;
    let end = document.getElementById("endDate").value;

    if (!persons || !start || !end) {
        document.getElementById("stayTotal").innerText =
            "Enter all details";
        return;
    }

    // calculate days
    let days = Math.ceil(
        (new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)
    );

    if (days <= 0) {
        document.getElementById("stayTotal").innerText =
            "Invalid dates";
        return;
    }

    // formula
    let total = days * persons * STAY_RATE;

    document.getElementById("stayTotal").innerText =
        `Days: ${days} | Persons: ${persons} | Total: ₹${total}`;
}
</script>

</body>
</html>
